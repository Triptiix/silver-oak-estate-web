name: Silver Oak Estate CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application-quality:
    name: Application Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-placeholder
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-turnstile-site-key-placeholder
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_ci_placeholder
      APP_ENV: development
      APP_TIMEZONE: Asia/Kolkata
      PAYMENT_PROVIDER: razorpay
      PAYMENT_MODE: test
      BOOKING_HOLD_MINUTES: "10"
      MANUAL_PAYMENT_HOLD_MINUTES: "30"
      DATABASE_CRON_ENABLED: "true"
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder
      RAZORPAY_KEY_SECRET: ci-razorpay-secret-placeholder
      PAYMENT_WEBHOOK_SECRET: ci-non-secret-webhook-8f3a1c7e5d9b2a6046c8e1f7
      TURNSTILE_SECRET_KEY: ci-turnstile-secret-placeholder
      BOOKING_TOKEN_SECRET: ci-non-secret-booking-token-6e2b9d4f8a1c7e3055f0b3d9
      ICAL_FEED_SECRET: ci-non-secret-ical-token-4c8e1a7f3d9b6052e6f0a2c8
      EMAIL_API_KEY: ci-email-api-placeholder
      EMAIL_SENDER: ci@example.invalid
      ADMIN_NOTIFICATION_RECIPIENTS: admin@example.invalid
      CRON_SECRET: ci-non-secret-cron-token-9a5d2f7c1e8b4063d4f6a9c2
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check application
        run: npm run typecheck

      - name: Lint application
        run: npm run lint

      - name: Test application
        run: npm run test

      - name: Build application
        run: npm run build

      - name: Check whitespace
        run: git diff --check

  database-and-concurrency:
    name: Database and Concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DO_NOT_TRACK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npm run db:start

      - name: Reset local database
        run: npm run db:reset

      - name: Lint local database
        run: npm run db:lint

      - name: Test local database
        shell: bash
        run: |
          set -o pipefail
          npm run db:test 2>&1 | tee /tmp/db-test.log

      - name: Upload database test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-test-log
          path: /tmp/db-test.log
          if-no-files-found: error
          retention-days: 1

      - name: Generate database types
        run: npm run db:types

      - name: Verify generated database types
        run: git diff --exit-code -- src/types/database.types.ts

      - name: Test booking and administrator concurrency
        run: npm run test:concurrency

      - name: Check whitespace
        run: git diff --check

      - name: Stop local Supabase
        if: always()
        run: npm run db:stop
